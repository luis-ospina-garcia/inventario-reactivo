services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      R2DBC_URL: r2dbc:postgresql://postgres:5432/inventario
      FLYWAY_URL: jdbc:postgresql://postgres:5432/inventario
      DB_USER: inventario
      DB_PASSWORD: inventario
    ports:
      - "8080:8080"

volumes:
  postgres-data:
